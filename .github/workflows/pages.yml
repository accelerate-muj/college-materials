name: Pages

on:
  push:
    branches: [main]
  # So the site can be redeployed without an empty commit — useful after
  # changing a Pages setting, or to recover from a failed deploy.
  workflow_dispatch:

# Deploying from a workflow rather than the "deploy from a branch" setting,
# which is how accelerate-muj/resources is published. Two reasons: the setting
# can only be flipped by hand in the repository's settings, whereas this file
# turns Pages on by itself via `enablement: true` below; and having the
# deployment in the repository makes it reviewable and reproducible instead of
# being invisible state somebody set once.
permissions:
  contents: read

# One deployment at a time. `cancel-in-progress: false` so a run that is
# already publishing is allowed to finish rather than leaving the site
# half-updated — a queued run will redeploy straight after.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs because the organisation enables
# `sha_pinning_required` (SETUP_LOG.md #36/#55) — a movable tag like @v5 is
# rejected before the run starts. The trailing comment records the tag.
#
# Split into build and deploy, matching GitHub's own starter workflow. Only the
# deploy job binds the `github-pages` environment, so enabling Pages happens in
# a job that is not itself gated on that environment existing.

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `enablement: true` creates the Pages site if the repository does not
      # have one yet, so the first run of this workflow is what turns Pages on.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      # These two steps are actions/upload-pages-artifact@v3 inlined.
      #
      # That action cannot be used here: it is a composite action whose last
      # step is `uses: actions/upload-artifact@v4` — a movable tag, inside a
      # file we do not control — and the org's sha_pinning_required rejects the
      # whole run when it resolves that reference. Inlining is the only way to
      # pin it. The tar flags below are copied verbatim from the action, so the
      # artifact is byte-for-byte what deploy-pages expects.
      #
      # The whole repository root is the site. There is no build step — the
      # pages are hand-written HTML and the archive is baked into pyq/data.js
      # by build.js, which CI separately checks is in sync. .git and .github are
      # excluded; everything else is public anyway.
      - name: Archive the site
        run: |
          tar \
            --dereference --hard-dereference \
            --directory . \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      # The name must be exactly "github-pages" — that is the artifact
      # deploy-pages looks for.
      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
