name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Turns GitHub Pages on and points it at main / root — the same "deploy from a
# branch" setup accelerate-muj/resources uses. Once the setting is in place
# GitHub builds and serves the site on every push by itself; this workflow only
# asserts the setting, which is idempotent and costs a few seconds.
#
# Why not the usual actions/deploy-pages flow: that action authenticates with an
# OIDC token and so needs `id-token: write`, and this organisation does not
# grant it. Every job that requested `id-token: write` failed at dispatch in one
# second with no steps and no logs, while the identical job without it ran
# fine — see runs #1–#3 of this workflow. Branch-based serving needs no OIDC.
#
# `pages: write` is the only elevated permission required. The org defaults
# GITHUB_TOKEN to read-only (SETUP_LOG.md #35); declaring it here raises it for
# this workflow alone.
permissions:
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  configure:
    name: Point Pages at main / root
    runs-on: ubuntu-latest

    steps:
      # No checkout: this job only talks to the Pages API. The site content is
      # served straight from the branch by GitHub.
      #
      # Values reach the shell through env rather than ${{ }} interpolation.
      # None of these are attacker-controlled, but interpolating expressions
      # into a run block is how campus-mapper got a shell-injection bug, and
      # the habit is worth keeping.
      - name: Enable Pages on main / root
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$REPO/pages"
          payload='{"source":{"branch":"main","path":"/"},"build_type":"legacy"}'

          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          existing=$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "$api")

          if [ "$existing" = "404" ]; then
            echo "Pages is not enabled yet — creating the site."
            curl -fsS -X POST "${auth[@]}" -d "$payload" "$api" > /dev/null
          else
            echo "Pages already exists (HTTP $existing) — asserting the source."
            curl -fsS -X PUT "${auth[@]}" -d "$payload" "$api" > /dev/null
          fi

          echo "::group::Pages configuration"
          curl -fsS "${auth[@]}" "$api"
          echo
          echo "::endgroup::"
