name: Pages status

# Read-only diagnostic: prints the repository's GitHub Pages configuration so
# the source, build type and last build status can be checked without guessing.
# Run it from the Actions tab. It deploys nothing and changes nothing.
#
# It cannot change anything: PUT /repos/{owner}/{repo}/pages answers
# "Resource not accessible by integration" (403) to a workflow GITHUB_TOKEN
# regardless of `pages: write`, for every combination of `source` and
# `build_type`. Changing the Pages source needs a user with admin access, in
# the settings UI. See README.md, "Enabling Pages".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  status:
    name: Report Pages configuration
    runs-on: ubuntu-latest
    steps:
      - name: Read the Pages API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")

          echo "HTTP $code"
          if [ "$code" = "404" ]; then
            echo "No Pages site exists for this repository."
            exit 0
          fi

          cat /tmp/pages.json
          echo

          # "build_type": "workflow" with "status": null is the state that
          # serves a 404 — Pages exists but nothing has ever been published to
          # it, and the source branch is ignored while the build type is
          # "workflow". Branch serving is what this repository wants.
          if grep -q '"build_type": *"workflow"' /tmp/pages.json; then
            echo "::warning::build_type is 'workflow'. This repository serves from a branch — set Settings > Pages > Source to 'Deploy from a branch', main / (root)."
          fi
